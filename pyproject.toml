[project]
name = "stm"
description = "Sound topic modeling - discover units/phrases/themes in audio files using topic models."
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
    "hdbscan>=0.8.40",
    "ipykernel>=7.3.0",
    "librosa>=0.11.0",
    "matplotlib>=3.10.9",
    "numpy>=2.2.6",
    "onnxruntime>=1.24.3",
    "pandas>=2.3.3",
    "pysrt>=1.1.2",
    "pyyaml>=6.0.3",
    "soundfile>=0.14.0",
    "umap-learn>=0.5.7",
]
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Danelle Cline", email="dcline@mbari.org"}
]
maintainers = [
    {name = "Danelle Cline", email="dcline@mbari.org"},
]

[project.optional-dependencies]
cpu = [
    "torch==2.14.1",
    "torchvision==0.29.1",
]
cu130 = [
    "torch==2.14.1",
    "torchvision==0.29.1",
]

[project.scripts]
perchtopic = "stm.__main__:app"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.8"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = [
    "cache.py",
    "classify.py",
    "config.py"
]

[tool.uv]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cu130" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-cu130", extra = "cu130" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-cu130", extra = "cu130" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
