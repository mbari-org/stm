[project]
name = "perchtopic"
description = "Tool for discovering units/phrases/themes in audio files using Perch and topic models."
version = "0.1.0"
requires-python = ">=3.10,<3.15"
dependencies = [
    "hdbscan>=0.8.40",
    "ipykernel>=7.3.0",
    "librosa>=0.11.0",
    "matplotlib>=3.10.9",
    "numpy>=2.2.6",
    "onnxruntime>=1.24.3",
    "pandas>=2.3.3",
    "pyyaml>=6.0.3",
    "soundfile>=0.14.0",
    "torch>=2.14.0",
    "umap-learn>=0.5.7",
]
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Danelle Cline", email="dcline@mbari.org"}
]
maintainers = [
    {name = "Danelle Cline", email="dcline@mbari.org"},
]

[project.scripts]
perchtopic = "perchtopic.__main__:app"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.8"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = [
    "cache.py",
    "classify.py",
    "config.py"
]
